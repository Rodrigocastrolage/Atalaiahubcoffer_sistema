<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio — Atalaia Hub Coffee</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--espresso:#0a3d2e;--cafe:#0d4f3c;--caramelo:#e8c07d;--creme:#f5f0e8;--cinza:#5a6b5e;--vermelho:#b84040;--sombra:0 4px 24px rgba(10,61,46,0.15);--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--espresso);min-height:100vh;padding-bottom:90px}
header{background:var(--espresso);color:var(--creme);padding:18px 16px;position:sticky;top:0;z-index:10}
header h1{font-family:'Playfair Display',serif;font-size:1.3rem}
header p{font-size:.82rem;color:var(--caramelo);margin-top:2px}
.cats{display:flex;gap:7px;overflow-x:auto;padding:12px 16px;position:sticky;top:var(--hh,64px);background:var(--creme);z-index:9;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:7px 16px;border-radius:20px;border:1.5px solid #ddd;background:white;font:600 .8rem 'DM Sans',sans-serif;color:var(--cinza);cursor:pointer}
.cat.ativo{background:var(--espresso);color:white;border-color:var(--espresso)}
main{padding:4px 16px 16px;max-width:640px;margin:0 auto}
h2{font-family:'Playfair Display',serif;font-size:1.1rem;margin:16px 0 8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:white;border-radius:var(--radius);padding:13px 14px;margin-bottom:9px;box-shadow:var(--sombra)}
.item .nome{font-weight:600;font-size:.95rem}
.item .preco{color:var(--cinza);font-size:.85rem;margin-top:2px}
.qtd{display:flex;align-items:center;gap:10px;flex:none}
.qtd button{width:34px;height:34px;border-radius:50%;border:none;background:var(--caramelo);color:var(--espresso);font-size:1.2rem;font-weight:700;cursor:pointer}
.qtd button.menos{background:#eee}
.qtd span{min-width:18px;text-align:center;font-weight:700}
.barra{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:white;box-shadow:0 -4px 20px rgba(0,0,0,.1);display:none;z-index:20}
.barra.visivel{display:block}
.btn{width:100%;background:var(--espresso);color:white;border:none;border-radius:12px;padding:14px;font:700 1rem 'DM Sans',sans-serif;cursor:pointer;display:flex;justify-content:space-between}
.btn:disabled{opacity:.6}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,30,20,.55);z-index:30;align-items:flex-end;justify-content:center}
.modal-bg.aberto{display:flex}
.modal{background:white;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;padding:22px 18px}
.modal h3{font-family:'Playfair Display',serif;margin-bottom:12px}
.linha{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee;font-size:.92rem}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem;padding:12px 0}
.modal input,.modal textarea{width:100%;padding:11px 13px;border:1.5px solid #ddd;border-radius:10px;font:.93rem 'DM Sans',sans-serif;margin-top:8px;background:#fdfaf7}
.modal textarea{resize:none;height:70px}
.sec{background:#eee;color:var(--espresso);margin-top:8px;justify-content:center}
.aviso{text-align:center;padding:60px 24px;color:var(--cinza)}
.aviso h2{margin-top:0}
.ok{text-align:center;padding:50px 24px}
.ok .check{font-size:3rem}
.ok p{color:var(--cinza);margin:8px 0 22px}
.erro{color:var(--vermelho);font-size:.85rem;margin-top:8px;display:none}
.pagar{font-size:.78rem;color:var(--cinza);text-align:center;margin-top:10px}
.tabs{display:flex;gap:8px;margin-top:12px}
.tab{flex:1;background:rgba(255,255,255,.12);color:var(--creme);border:none;border-radius:10px;padding:9px;font:600 .85rem 'DM Sans',sans-serif;cursor:pointer}
.tab.ativo{background:var(--caramelo);color:var(--espresso)}
.tab .n{display:inline-block;background:var(--vermelho);color:white;border-radius:10px;font-size:.7rem;padding:0 6px;margin-left:5px}
.tab .n:empty{display:none}
.pedido{background:white;border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--sombra)}
.pedido.meu{border:2px solid var(--caramelo)}
.pedido.cancelado{opacity:.6}
.pedido .topo{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.9rem;margin-bottom:6px}
.pedido .topo small{font-weight:400;color:var(--cinza)}
.pedido .it{font-size:.88rem;padding:2px 0}
.pedido .ob{font-size:.82rem;color:var(--vermelho);font-style:italic;margin-top:4px}
.passos{display:flex;align-items:center;margin:14px 4px 4px}
.passo{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.68rem;color:#aaa;font-weight:600;flex:none;width:64px;text-align:center}
.passo i{width:22px;height:22px;border-radius:50%;background:#e4e4e4;display:block}
.passo.feito{color:var(--espresso)}
.passo.feito i{background:var(--espresso)}
.passo.atual i{animation:pulsa 1.3s infinite}
.liga{flex:1;height:3px;background:#e4e4e4;margin-bottom:18px}
.liga.feito{background:var(--espresso)}
@keyframes pulsa{50%{box-shadow:0 0 0 6px rgba(10,61,46,.2)}}
.cancel-tag{color:var(--vermelho);font-weight:700;font-size:.85rem;margin-top:8px}
.tot-mesa{display:flex;justify-content:space-between;font-weight:700;padding:6px 4px 14px}
.vazio{text-align:center;color:var(--cinza);padding:40px 20px}
.aviso-topo{position:fixed;top:12px;left:12px;right:12px;max-width:616px;margin:0 auto;background:var(--espresso);color:white;border-radius:12px;padding:14px 16px;font-weight:600;font-size:.92rem;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;cursor:pointer}
</style>
</head>
<body>

<header>
  <h1>Atalaia Hub Coffee</h1>
  <p id="mesa-label">Carregando…</p>
  <div class="tabs" id="tabs" style="display:none">
    <button class="tab ativo" id="tab-cardapio" onclick="aba('cardapio')">Cardápio</button>
    <button class="tab" id="tab-pedidos" onclick="aba('pedidos')">Pedidos da mesa<span class="n" id="tab-n"></span></button>
  </div>
</header>
<div class="aviso-topo" id="aviso-topo" onclick="aba('pedidos');this.style.display='none'"></div>

<div id="conteudo">
  <div class="cats" id="cats"></div>
  <main id="lista"></main>
</div>
<main id="acomp" style="display:none"></main>

<div class="barra" id="barra">
  <button class="btn" onclick="abrirResumo()"><span id="barra-qtd"></span><span>Ver pedido · <span id="barra-total"></span></span></button>
</div>

<div class="modal-bg" id="modal" onclick="if(event.target===this)fecharResumo()">
  <div class="modal">
    <h3>Seu pedido</h3>
    <div id="resumo"></div>
    <div class="total"><span>Total</span><span id="resumo-total"></span></div>
    <input id="cliente" placeholder="Seu nome (opcional)" maxlength="40">
    <textarea id="obs" placeholder="Observações (ex: sem açúcar)" maxlength="200"></textarea>
    <div class="erro" id="erro"></div>
    <button class="btn" id="btn-enviar" style="justify-content:center;margin-top:14px" onclick="enviar()">Enviar pedido</button>
    <button class="btn sec" onclick="fecharResumo()">Voltar ao cardápio</button>
    <div class="pagar">Outras pessoas da mesa também podem pedir pelo mesmo QR Code. O pagamento é feito no caixa ao final.</div>
  </div>
</div>

<script>
const SUPA_URL = 'https://eesxonzhyiskrchxlnkf.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlc3hvbnpoeWlza3JjaHhsbmtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MzIwNjYsImV4cCI6MjA5MTUwODA2Nn0.gJutNcFvE36eT1OHpAEUuk0z0OOspI-3eSRTWPdr9Uk';
const HEADERS = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer '+SUPA_KEY, 'Content-Type': 'application/json' };

const mesa = parseInt(new URLSearchParams(location.search).get('mesa'), 10);
let produtos = [], categoria = null;
const carrinho = {}; // id -> qtd

const $ = id => document.getElementById(id);
const brl = n => 'R$ ' + Number(n).toFixed(2).replace('.', ',');

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}

async function init(){
  if(!(mesa > 0)){
    $('mesa-label').textContent = '';
    $('conteudo').innerHTML = '<div class="aviso"><h2>Mesa não identificada</h2><p>Escaneie o QR Code da sua mesa para fazer o pedido.</p></div>';
    return;
  }
  $('mesa-label').textContent = 'Mesa ' + mesa;
  $('tabs').style.display = 'flex';
  ajustarAltura();
  window.addEventListener('resize', ajustarAltura);
  document.addEventListener('click', liberarSom);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) carregarPedidos(); });
  try { $('cliente').value = localStorage.getItem('atalaia_nome') || ''; } catch(e){}
  carregarPedidos();
  setInterval(() => { if(!document.hidden) carregarPedidos(); }, 5000);
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/produtos?select=id,nome,cat,preco,estoque&order=nome&limit=1000', { headers: HEADERS });
    if(!r.ok) throw new Error(r.status);
    const raw = await r.json();
    // mesma regra do sistema: mantém o registro mais novo por nome
    const mapa = {};
    raw.forEach(p => { const k = p.nome.trim().toLowerCase(); if(!mapa[k] || p.id > mapa[k].id) mapa[k] = p; });
    produtos = Object.values(mapa).filter(p => p.estoque > 0 && p.preco > 0);
  } catch(e){
    $('conteudo').innerHTML = '<div class="aviso"><h2>Não foi possível carregar o cardápio</h2><p>Chame um atendente ou tente novamente.</p></div>';
    return;
  }
  const cats = [...new Set(produtos.map(p => p.cat || 'Outros'))];
  categoria = cats[0] || null;
  renderCats(cats);
  renderLista();
}

function renderCats(cats){
  const box = $('cats');
  box.innerHTML = '';
  cats.forEach(c => {
    const b = el('button', 'cat' + (c === categoria ? ' ativo' : ''), c);
    b.onclick = () => { categoria = c; renderCats(cats); renderLista(); window.scrollTo(0, 0); };
    box.appendChild(b);
  });
}

function renderLista(){
  const box = $('lista');
  box.innerHTML = '';
  box.appendChild(el('h2', null, categoria || ''));
  produtos.filter(p => (p.cat || 'Outros') === categoria).forEach(p => {
    const row = el('div', 'item');
    const info = el('div');
    info.appendChild(el('div', 'nome', p.nome));
    info.appendChild(el('div', 'preco', brl(p.preco)));
    const q = el('div', 'qtd');
    const menos = el('button', 'menos', '−'); menos.onclick = () => mudar(p.id, -1);
    const mais = el('button', null, '+'); mais.onclick = () => mudar(p.id, 1);
    q.append(menos, el('span', null, carrinho[p.id] || 0), mais);
    row.append(info, q);
    box.appendChild(row);
  });
  atualizarBarra();
}

function mudar(id, d){
  const p = produtos.find(x => x.id === id);
  const n = Math.max(0, Math.min(p.estoque, 20, (carrinho[id] || 0) + d));
  if(n) carrinho[id] = n; else delete carrinho[id];
  renderLista();
}

function itensCarrinho(){
  return Object.keys(carrinho).map(id => {
    const p = produtos.find(x => x.id === Number(id));
    return { id: p.id, nome: p.nome, qtd: carrinho[id], preco: p.preco };
  });
}
const totalCarrinho = () => itensCarrinho().reduce((s, i) => s + i.preco * i.qtd, 0);

function atualizarBarra(){
  const itens = itensCarrinho();
  const n = itens.reduce((s, i) => s + i.qtd, 0);
  $('barra').classList.toggle('visivel', n > 0);
  $('barra-qtd').textContent = n + (n === 1 ? ' item' : ' itens');
  $('barra-total').textContent = brl(totalCarrinho());
}

function abrirResumo(){
  const box = $('resumo');
  box.innerHTML = '';
  itensCarrinho().forEach(i => {
    const l = el('div', 'linha');
    l.append(el('span', null, i.qtd + '× ' + i.nome), el('span', null, brl(i.preco * i.qtd)));
    box.appendChild(l);
  });
  $('resumo-total').textContent = brl(totalCarrinho());
  $('erro').style.display = 'none';
  $('modal').classList.add('aberto');
}
function fecharResumo(){ $('modal').classList.remove('aberto'); }

async function enviar(){
  const itens = itensCarrinho();
  if(!itens.length) return;
  const btn = $('btn-enviar');
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/pedidos_mesa', {
      method: 'POST',
      headers: { ...HEADERS, 'Prefer': 'return=representation' },
      body: JSON.stringify({
        mesa, itens, total: totalCarrinho(), status: 'novo',
        cliente: $('cliente').value.trim() || null,
        obs: $('obs').value.trim() || null
      })
    });
    if(!r.ok) throw new Error(r.status);
    const criado = await r.json();
    guardarMeuPedido(Array.isArray(criado) ? criado[0] : criado);
  } catch(e){
    btn.disabled = false; btn.textContent = 'Enviar pedido';
    $('erro').textContent = 'Não foi possível enviar. Tente novamente ou chame um atendente.';
    $('erro').style.display = 'block';
    return;
  }
  try { localStorage.setItem('atalaia_nome', $('cliente').value.trim()); } catch(e){}
  btn.disabled = false; btn.textContent = 'Enviar pedido';
  $('obs').value = '';
  Object.keys(carrinho).forEach(k => delete carrinho[k]);
  fecharResumo();
  renderLista();
  await carregarPedidos();
  aba('pedidos');
  avisar('✅ Pedido enviado! Acompanhe por aqui.');
}

// ───── Acompanhamento ─────
let aba_atual = 'cardapio', pedidosMesa = [], statusAnterior = null, audioCtx = null, avisoTimer = null;
const ORDEM = ['novo', 'preparando', 'entregue'];
const NOMES = ['Recebido', 'Em produção', 'Entregue'];

function ajustarAltura(){ document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px'); }

function aba(qual){
  aba_atual = qual;
  const ped = qual === 'pedidos';
  $('conteudo').style.display = ped ? 'none' : '';
  $('acomp').style.display = ped ? '' : 'none';
  $('tab-cardapio').classList.toggle('ativo', !ped);
  $('tab-pedidos').classList.toggle('ativo', ped);
  if(ped){ $('barra').classList.remove('visivel'); renderPedidos(); } else { atualizarBarra(); }
  window.scrollTo(0, 0);
}

function meusIds(){ try { return JSON.parse(localStorage.getItem('atalaia_pedidos') || '[]'); } catch(e){ return []; } }
function guardarMeuPedido(p){
  if(!p || !p.id) return;
  try { localStorage.setItem('atalaia_pedidos', JSON.stringify([...meusIds(), p.id].slice(-50))); } catch(e){}
}

function liberarSom(){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}
function bip(){
  if(!audioCtx) return;
  [0, .18].forEach((t, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = i ? 1000 : 760; g.gain.value = .12;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .14);
  });
}
function avisar(msg, forte){
  const a = $('aviso-topo');
  a.textContent = msg; a.style.display = 'block';
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => { a.style.display = 'none'; }, 8000);
  if(forte){ bip(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch(e){} }
}

async function carregarPedidos(){
  try {
    // só pedidos desta mesa, das últimas 12h, ainda não pagos
    const desde = new Date(Date.now() - 12 * 3600 * 1000).toISOString();
    const url = SUPA_URL + '/rest/v1/pedidos_mesa?mesa=eq.' + mesa + '&status=in.(novo,preparando,entregue,cancelado)&criado_em=gte.' + encodeURIComponent(desde) + '&order=id';
    const r = await fetch(url, { headers: HEADERS });
    if(!r.ok) return;
    pedidosMesa = await r.json();
  } catch(e){ return; }
  notificarMudancas();
  const abertos = pedidosMesa.filter(p => p.status !== 'cancelado').length;
  $('tab-n').textContent = abertos || '';
  if(aba_atual === 'pedidos') renderPedidos();
}

function notificarMudancas(){
  const meus = meusIds();
  const atual = {};
  pedidosMesa.forEach(p => { atual[p.id] = p.status; });
  if(statusAnterior){
    pedidosMesa.forEach(p => {
      if(!meus.includes(p.id) || statusAnterior[p.id] === p.status) return;
      if(p.status === 'preparando') avisar('👨‍🍳 Seu pedido #' + p.id + ' entrou em produção!', true);
      else if(p.status === 'entregue') avisar('✅ Seu pedido #' + p.id + ' foi entregue. Bom apetite!', true);
      else if(p.status === 'cancelado') avisar('⚠️ Seu pedido #' + p.id + ' foi cancelado. Fale com um atendente.', true);
    });
  }
  statusAnterior = atual;
}

function renderPedidos(){
  const box = $('acomp');
  box.innerHTML = '';
  const meus = meusIds();
  // cancelados só aparecem para quem fez o pedido
  const lista = pedidosMesa.filter(p => p.status !== 'cancelado' || meus.includes(p.id));
  if(!lista.length){
    box.appendChild(el('div', 'vazio', 'Nenhum pedido nesta mesa ainda. Escolha algo no cardápio!'));
    return;
  }
  const total = pedidosMesa.filter(p => p.status !== 'cancelado').reduce((s, p) => s + Number(p.total || 0), 0);
  const tm = el('div', 'tot-mesa');
  tm.append(el('span', null, 'Total da mesa ' + mesa), el('span', null, brl(total)));
  box.appendChild(tm);

  lista.slice().reverse().forEach(p => {
    const meu = meus.includes(p.id);
    const card = el('div', 'pedido' + (meu ? ' meu' : '') + (p.status === 'cancelado' ? ' cancelado' : ''));
    const hora = new Date(p.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const topo = el('div', 'topo');
    const quem = (p.cliente ? p.cliente : 'Pedido #' + p.id) + (meu ? ' (você)' : '');
    topo.append(el('span', null, quem), el('small', null, hora + ' · ' + brl(p.total)));
    card.appendChild(topo);
    (p.itens || []).forEach(i => card.appendChild(el('div', 'it', i.qtd + '× ' + i.nome)));
    if(p.obs) card.appendChild(el('div', 'ob', 'Obs: ' + p.obs));
    if(p.status === 'cancelado'){
      card.appendChild(el('div', 'cancel-tag', 'Pedido cancelado'));
    } else {
      const idx = ORDEM.indexOf(p.status);
      const passos = el('div', 'passos');
      NOMES.forEach((nome, n) => {
        const ps = el('div', 'passo' + (n <= idx ? ' feito' : '') + (n === idx && idx < 2 ? ' atual' : ''));
        ps.append(el('i'), el('span', null, nome));
        passos.appendChild(ps);
        if(n < 2) passos.appendChild(el('div', 'liga' + (n < idx ? ' feito' : '')));
      });
      card.appendChild(passos);
    }
    box.appendChild(card);
  });
}

init();
</script>
</body>
</html>
